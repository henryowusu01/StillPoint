<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StillPoint- Check-In</title>
    <link rel="stylesheet" href="Style2.css">
</head>
<body>
    
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="logo-box">
      <img src="logo.png" alt="Stillpoint logo">
    </div>

    <nav class="nav">
      <a href="Main.html">Home</a>
      <a class="active">Check-In</a>
      <a>History</a>
      <a>About</a>
    </nav>

    <footer class="sidebar-footer">
      <small>copyright<br>signature with<br>year</small>
    </footer>

  </aside>

  <!-- MAIN CONTENT -->
  <main class="main">

    <!-- TOP BAR -->
 <header class="top-bar">
 Take a quiet moment to notice how you’re feeling <span id="welcomeName"></span>
</header>

    <!-- HERO IMAGE -->
    <section class="hero">

      <img src="Rain.jpg" alt="Calm landscape">
 
        <!-- CHECK-IN FORM -->
         <div class="checkin-container">

  <h1>Daily Check-In</h1>
  <p class="subtitle">Take a moment to notice how you’re feeling today.</p>

  <form id="checkinForm">

  <!-- 1 -->
  <label>1. How would you describe your mood right now?</label>
  <div class="radio-group">
    <label><input type="radio" name="q1"value="4" required> Very calm</label>
    <label><input type="radio" name="q1"value="3"> Calm</label>
    <label><input type="radio" name="q1"value="2"> Neutral</label>
    <label><input type="radio" name="q1" value="1"> Stressed</label>
    <label><input type="radio" name="q1" value="0"> Overwhelmed</label>

  </div>

  <!-- 2 -->
  <label>2. How anxious do you feel?</label>
  <div class="radio-group">
    <label><input type="radio" name="q2" value="3" required> Not anxious</label>
    <label><input type="radio" name="q2" value="2"> Slightly anxious</label>
    <label><input type="radio" name="q2"value="1"> Moderately anxious</label>
    <label><input type="radio" name="q2"value="0"> Very anxious</label>
  </div>

  <!-- 3 -->
  <label>3. How is your energy level?</label>
  <div class="radio-group">
    <label><input type="radio" name="q3"  value="3"required> Very low</label>
    <label><input type="radio" name="q3" value="2"> Low</label>
    <label><input type="radio" name="q3"value="1"> Balanced</label>
    <label><input type="radio" name="q3"value="0"> High</label>
  </div>

  <!-- 4 -->
  <label>4. Did you sleep well last night?</label>
  <div class="radio-group">
    <label><input type="radio" name="q4"value="2" required> Yes</label>
    <label><input type="radio" name="q4"value="1"> Somewhat</label>
    <label><input type="radio" name="q4"value="0"> No</label>
  </div>

  <!-- 5 -->
  <label>5. How focused do you feel today?</label>
  <div class="radio-group">
    <label><input type="radio" name="q5" value="2"required> Very focused</label>
    <label><input type="radio" name="q5"value="1"> Somewhat focused</label>
    <label><input type="radio" name="q5"value="0"> Easily distracted</label>
  </div>

  <!-- 6 -->
  <label>6. Have you felt stressed today?</label>
  <div class="radio-group">
    <label><input type="radio" name="q6" value="2"required> Not at all</label>
    <label><input type="radio" name="q6"value="1"> A little</label>
    <label><input type="radio" name="q6"value="0"> A lot</label>
  </div>

  <!-- 7 -->
  <label>7. How connected do you feel to others today?</label>
  <div class="radio-group">
    <label><input type="radio" name="q7" value="2"required> Very connected</label>
    <label><input type="radio" name="q7"value="1"> Somewhat connected</label>
    <label><input type="radio" name="q7"value="0"> Disconnected</label>
  </div>

  <!-- 8 -->
  <label>8. What best describes your thoughts today?</label>
  <div class="radio-group">
    <label><input type="radio" name="q8" value="3"required> Calm and clear</label>
    <label><input type="radio" name="q8"value="2"> Busy</label>
    <label><input type="radio" name="q8"value="1"> Heavy</label>
    <label><input type="radio" name="q8"value="0"> Overthinking</label>
  </div>

  <!-- 9 -->
  <label>9. Did you take time for yourself today?</label>
  <div class="radio-group">
    <label><input type="radio" name="q9" value="2"required> Yes</label>
    <label><input type="radio" name="q9" value="1"> A little</label>
    <label><input type="radio" name="q9" value="0"> Not yet</label>
  </div>

  <!-- 10 -->
  <label>10. Overall, how does today feel?</label>
  <div class="radio-group">
    <label><input type="radio" name="q10" value="2"required> Good</label>
    <label><input type="radio" name="q10"value="1"> Okay</label>
    <label><input type="radio" name="q10"value="0"> Difficult</label>
  </div>

  <button type="submit"> Complete Check-In </button>
  <div id="result" class="result hidden">
  <div id="emoji" class="emoji">🙂</div>
  <p id="message"></p>

</div>


</form>

</div>

<script src="Script.js"></script>

    </section>

  </main>

</body>
</html>
