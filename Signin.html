<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp - StillPoint</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

      <!-- Background image wrapper -->
  <div class="background">
   

    <!-- Form Card -->
    <div class="auth-card animate">

      <!-- Logo -->
      <div class="logo">
    
            
      <a href="Home.Html"> <img src="images/SPLogo.png" alt="StillPoint Logo"></a>
      </div>

      <!-- Form -->
      <form class="auth-form" action="Main.html">

        <label>Full Name</label>
        <input type="text" placeholder="Enter your full name" required>

        <label>Email</label>
        <input type="email" placeholder="Enter your email" required>

        <label>Phone Number</label>
        <input type="tel" placeholder="Enter your phone number">

        <label>Password</label>
        <input type="password" placeholder="Create a password" required>


        <button type="submit" class="cta full-width">
          Sign Up  
        </button>
        <p id="formMessage"></p>

        <p class="privacy-text">
         Your name will only be displayed. Your passwords and information will never be shown to public
        </p>

        <a href="LogIn.html" class="login-link">Already have an account?</a>

      </form>

    </div>

  </div>

  <script src="script.js"></script>
    
</body>
</html>
