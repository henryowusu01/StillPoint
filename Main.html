<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StillPoint- Main</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <button id="menuToggle" class="menu-btn">☰</button>

    <div class="logo-box">
      <img src="logo.png" alt="Stillpoint logo">
    </div>


    <nav class="nav">
      <a class="active">Home</a>
      <a href="Check-in.html">Check-In</a>
      <a href="History.html">History</a>
      <a>About</a>
    </nav>

    <footer class="sidebar-footer">



      <small> 
        <B> © 2026 StillPoint. All rights reserved.</B>
      </small>
    </footer>

  </aside>

  <!-- MAIN CONTENT -->
  <main class="main">

    <!-- TOP BAR -->
    <header class="top-bar">
      Welcome {FullName}
    </header>

    <!-- HERO IMAGE -->
    <section class="hero">

      <img src="main.jpg" alt="Calm landscape">

      <!-- FEATURE CARDS -->
      <div class="features">

        <div class="feature-card light">
          Gentle daily<br>check-ins
        </div>

        <div class="feature-card dark">
          Private by<br>design
        </div>

        <div class="feature-card blue">
          Calm<br>breathing<br>tools
        </div>

      </div>

    </section>

  </main>

</div>

 <script src="Main.js"></script>
</body>
</html>
