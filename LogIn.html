<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogIn</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    
      <!-- Background image wrapper -->
  <div class="background">
   

    <!-- Form Card -->
    <div class="auth-card animate">

      <!-- Logo -->
      <div class="logo">
       <h1 class="logo">
            <img src="Wordmark_Logo_for_StillPoint_Mental_Health-removebg-preview.png" alt="StillPoint Logo">
        </h1>
      </div>

       <!-- Form -->
      <form class="auth-form">

        <label>Email</label>
        <input type="text" placeholder="Enter your  email" required>

        <label>Password</label>
        <input type="password" placeholder="Enter Password" required>


        <button type="submit" class="cta full-width">
            <a href="Main.html">
          Log In
        </button>
</a>

        <a href="Signin.html" class="login-link">Want to Sign Up?</a>

         <p class="privacy-text">
          Your name will be shared. Never submit passwords.
        </p>

  
      </form>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
